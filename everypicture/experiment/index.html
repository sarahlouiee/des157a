<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Every Picture Experiment</title>

    <link href="styles.css" rel="stylesheet">
    <script src="script.js" defer></script>
</head>

<body>
    <main id="container">

        <img src="images/artwork1.jpg" alt="Portrait artwork" id="artwork">

        <div id="star1" class="star">☆</div>

        <div class="purple-star star-fill star-a">☆</div>
        <div class="purple-star star-fill star-b">☆</div>
        <div class="purple-star star-fill star-c">☆</div>

    </main>

    <section id="overlay" class="hidden">
        <article id="modal">
            <h2>Artwork Title</h2>
            <img src="images/artwork1.jpg" alt="Portrait artwork">
            <p>
                This piece explores identity through portraiture and star imagery,
                reflecting the intersection of being Chinese and American.
            </p>
            <button id="close">close</button>
        </article>
    </section>

</body>
</html>
